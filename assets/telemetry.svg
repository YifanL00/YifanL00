<svg xmlns="http://www.w3.org/2000/svg" width="850" height="180" viewBox="0 0 850 180" role="img" aria-labelledby="title desc">
  <title id="title">Build telemetry</title><desc id="desc">Eleven public repositories across AI agents, data systems and web tools</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#101827"/></linearGradient>
    <style>
      .value{fill:#f8fafc;font:700 25px Inter,Segoe UI,sans-serif}.label{fill:#64748b;font:10px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.4px}.pulse{animation:pulse 4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
      @media(prefers-color-scheme:light){.surface{fill:#fff}.value{fill:#1f2328}.label{fill:#57606a}.divider{stroke:#d0d7de}.muted{fill:#57606a}}
    </style>
  </defs>
  <rect class="surface" x=".5" y=".5" width="849" height="179" rx="14" fill="url(#bg)" stroke="#1e293b"/>
  <text class="muted" x="30" y="36" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="3">BUILD TELEMETRY</text>
  <g class="divider" stroke="#26354d" opacity=".75"><path d="M212.5 54v96M425 54v96M637.5 54v96"/></g>
  <g text-anchor="middle" transform="translate(106 0)"><circle class="pulse" cy="65" r="4" fill="#22d3ee"/><text class="value" y="106">11</text><text class="label" y="130">PUBLIC REPOS</text></g>
  <g text-anchor="middle" transform="translate(319 0)"><circle class="pulse" cy="65" r="4" fill="#a78bfa" style="animation-delay:.7s"/><text class="value" y="106">AI</text><text class="label" y="130">AGENT SYSTEMS</text></g>
  <g text-anchor="middle" transform="translate(531 0)"><circle class="pulse" cy="65" r="4" fill="#34d399" style="animation-delay:1.4s"/><text class="value" y="106">DATA</text><text class="label" y="130">LAKEHOUSE STACKS</text></g>
  <g text-anchor="middle" transform="translate(744 0)"><circle class="pulse" cy="65" r="4" fill="#f59e0b" style="animation-delay:2.1s"/><text class="value" y="106">WEB</text><text class="label" y="130">TOOLS &amp; AUTOMATION</text></g>
</svg>
