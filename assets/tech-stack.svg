<svg xmlns="http://www.w3.org/2000/svg" width="850" height="300" viewBox="0 0 850 300" role="img" aria-labelledby="title desc">
  <title id="title">Yifan's technology stack</title><desc id="desc">AI, data, web and automation tools</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#101827"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>
    <style>
      .chip{fill:#111c2e;stroke:#26354d}.chiptext{fill:#cbd5e1;font:12px ui-monospace,SFMono-Regular,Consolas,monospace}.label{font:700 12px Inter,Segoe UI,sans-serif;letter-spacing:1.5px}.node{animation:pulse 4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
      @media(prefers-color-scheme:light){.surface{fill:#fff}.chip{fill:#f6f8fa;stroke:#d0d7de}.chiptext{fill:#1f2328}.muted{fill:#57606a}}
    </style>
  </defs>
  <rect class="surface" x=".5" y=".5" width="849" height="299" rx="14" fill="url(#bg)" stroke="#1e293b"/>
