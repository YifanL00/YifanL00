<svg xmlns="http://www.w3.org/2000/svg" width="850" height="330" viewBox="0 0 850 330" role="img" aria-labelledby="title desc">
  <title id="title">Yifan L.</title>
  <desc id="desc">AI agents, data engineering and automation</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a13"/><stop offset=".5" stop-color="#0b1220"/><stop offset="1" stop-color="#10172a"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="45%" r="58%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".16"/><stop offset=".52" stop-color="#8b5cf6" stop-opacity=".08"/><stop offset="1" stop-color="#0b1220" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0v34" fill="none" stroke="#64748b" stroke-opacity=".08"/></pattern>
    <style>
      .star{animation:pulse 3.5s ease-in-out infinite}.orbit{animation:fade 6s ease-in-out infinite}.dash{stroke-dasharray:8 14;animation:move 10s linear infinite}
      @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}@keyframes fade{0%,100%{opacity:.25}50%{opacity:.7}}@keyframes move{to{stroke-dashoffset:-220}}
      @media (prefers-color-scheme: light){.surface{fill:#f6f8fa}.grid{opacity:.3}.primary{fill:#1f2328}.muted{fill:#57606a}.border{stroke:#d0d7de}}
    </style>
  </defs>
  <rect class="surface" x=".5" y=".5" width="849" height="329" rx="18" fill="url(#bg)" stroke="#1e293b"/>
  <rect class="grid" x="1" y="1" width="848" height="328" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="848" height="328" rx="18" fill="url(#aura)"/>
  <ellipse class="orbit border" cx="425" cy="154" rx="327" ry="104" fill="none" stroke="#22d3ee" stroke-opacity=".25" transform="rotate(-7 425 154)"/>
  <ellipse class="orbit border dash" cx="425" cy="154" rx="248" ry="70" fill="none" stroke="#a78bfa" stroke-opacity=".42" transform="rotate(9 425 154)"/>
  <circle cx="690" cy="95" r="4" fill="#22d3ee" filter="url(#glow)"/><circle cx="193" cy="225" r="3" fill="#a78bfa" filter="url(#glow)"/>
  <g fill="#e2e8f0">
    <circle class="star" cx="83" cy="65" r="1.5"/><circle class="star" cx="146" cy="107" r="1" style="animation-delay:.7s"/><circle class="star" cx="753" cy="69" r="1.5" style="animation-delay:1.1s"/><circle class="star" cx="787" cy="205" r="1" style="animation-delay:1.8s"/><circle class="star" cx="103" cy="267" r="1" style="animation-delay:2.2s"/><circle class="star" cx="661" cy="254" r="1.5" style="animation-delay:.35s"/>
  </g>
  <g text-anchor="middle">
    <text x="425" y="76" fill="#22d3ee" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="5">HELLO, WORLD — I'M</text>
    <text class="primary" x="425" y="145" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="62" font-weight="800" letter-spacing="-2">YIFAN L.</text>
    <rect x="276" y="163" width="298" height="1.5" fill="url(#line)"/>
    <text class="muted" x="425" y="198" fill="#cbd5e1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" letter-spacing="2">AI AGENTS · DATA ENGINEERING · AUTOMATION</text>
    <g transform="translate(291 232)">
      <rect width="268" height="38" rx="19" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".45"/>
      <circle cx="21" cy="19" r="4" fill="#34d399" filter="url(#glow)"/>
      <text x="142" y="24" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="1.5" text-anchor="middle">BUILDING USEFUL SYSTEMS</text>
    </g>
  </g>
  <path d="M34 48V27h21M795 27h21v21M34 282v21h21M795 303h21v-21" fill="none" stroke="#22d3ee" stroke-opacity=".42" stroke-width="2"/>
</svg>

